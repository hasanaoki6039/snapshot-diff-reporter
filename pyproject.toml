[project]
name = "snapshot-diff-reporter"
version = "0.1.2"
description = "Diffs two dicts and returns an added, removed, and changed dict, flattening nested keys with dot notation for nested-change reporting."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
